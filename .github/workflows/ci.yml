name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pytest
        run: uv run pytest
      # data/ is gitignored; DuckDB can create the file but not its folder.
      - name: dbt build (seeds + models + tests, no live sources)
        working-directory: dbt/jpower
        run: |
          mkdir -p ../../data
          uv run dbt build --profiles-dir .
