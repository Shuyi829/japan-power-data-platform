name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pytest
        run: uv run pytest
      # No live downloads in CI: create empty raw tables, then build models and tests.
      - name: Create empty raw tables
        run: uv run python -m jpower.load --init
      - name: dbt build (seeds + models + tests)
        working-directory: dbt/jpower
        run: uv run dbt build --profiles-dir .
