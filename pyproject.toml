[project]
name = "jpower"
version = "0.1.0"
description = "Half-hourly data platform for the Japanese wholesale power market, built from public sources."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=18",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "dbt-core>=1.9,<1.11",
    "dbt-duckdb>=1.9,<1.11",
]

[project.optional-dependencies]
snowflake = ["dbt-snowflake>=1.9,<1.11"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jpower"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
